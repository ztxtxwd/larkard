name: Publish

on:
  push:
    branches:
      - main

# Keep this filename: npm Trusted Publisher is bound to publish.yml
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      - id: select-mode
        uses: changesets/action/select-mode@v2

  # 直接发版：把版本号 + changelog 提交推到 main，不经过 PR。
  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # changeset version 生成 changelog 时需要本地 git fetch 追溯 changeset 所在提交
      # （@changesets/git deepenCloneBy）；同一份配置也让后面的 git push 带上 token。
      - name: Authenticate git for changesets changelog attribution and push
        run: >-
          git config --global
          url."https://x-access-token:${{ github.token }}@github.com/".insteadOf
          "https://github.com/"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Bump versions and changelogs
        run: pnpm ci:version

      - name: Commit and push version bump to main
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No version changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version packages"
          git push origin HEAD:main

  # 用 GITHUB_TOKEN 推的提交不会再触发新的 workflow run，所以 version 之后必须
  # 在同一轮里接着 build / test / publish。mode=publish（版本号已被手动提交）也走这里。
  publish:
    needs: [select-mode, version]
    if: >-
      always()
      && needs.select-mode.result == 'success'
      && needs.version.result != 'failure'
      && needs.version.result != 'cancelled'
      && (needs.select-mode.outputs.mode == 'publish' || needs.select-mode.outputs.mode == 'version')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # 发布后 changeset publish 会打 release tag，这里同样用 token 推送
      - name: Authenticate git for tag push
        run: >-
          git config --global
          url."https://x-access-token:${{ github.token }}@github.com/".insteadOf
          "https://github.com/"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted Publishing needs npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "./packages/*" build

      - run: pnpm --filter "./packages/*" test

      - name: Publish to npm
        run: pnpm exec changeset publish

      - name: Push release tags
        run: git push --tags
